<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極限運算梭哈 (玩家輸入算式版)</title>
<style>
  :root {
    --bg-color: #0b132b;
    --table-color: #1c2541;
    --card-bg: #ffffff;
    --text-color: #f1f5f9;
    --gold: #f59e0b;
    --blue: #3b82f6;
    --red: #ef4444;
    --green: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
  .table-container { width: 100%; max-width: 620px; background: var(--table-color); border: 2px solid #3a506b; border-radius: 14px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  
  .board-section { text-align: center; margin-bottom: 10px; }
  .symbol-board { display: flex; justify-content: center; gap: 10px; margin: 6px 0; }
  .card-symbol { width: 50px; height: 68px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3); }
  
  .pot-banner { background: #00000045; border-radius: 20px; display: inline-block; padding: 4px 14px; font-size: 13px; border: 1px solid #3a506b; }
  .pot-banner span { color: var(--gold); font-weight: bold; font-size: 15px; }

  .player-zone { background: #0b132b90; border: 1px solid #3a506b; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .chips { font-weight: bold; color: var(--gold); font-size: 14px; }
  
  .cards-row { display: flex; gap: 8px; align-items: center; }
  .card { width: 50px; height: 70px; background: var(--card-bg); color: #111; font-size: 22px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); position: relative; }
  .card.back { background: #334155; color: #64748b; border: 1.5px dashed #475569; }
  .card-tag { font-size: 9px; position: absolute; top: 2px; color: #64748b; }
  .card.back .card-tag { color: #94a3b8; }

  .action-panel { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button { padding: 8px 13px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; transition: 0.15s; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { background: #475569 !important; color: #94a3b8; cursor: not-allowed; opacity: 0.6; }
  .btn-start { background: var(--green); }
  .btn-call { background: var(--blue); }
  .btn-raise { background: var(--gold); color: #000; }
  .btn-fold { background: var(--red); }
  input[type="number"], input[type="text"] { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 13px; }

  /* 算式輸入專區 */
  .formula-box { display: none; background: #111e38; border: 2px solid var(--gold); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .formula-box.active { display: block; }
  .formula-input-row { display: flex; gap: 8px; margin: 8px 0; }
  .quick-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .quick-btn { background: #334155; color: #fff; padding: 6px 10px; font-size: 14px; border-radius: 4px; }
  .quick-btn:hover { background: #475569; }

  .history-box { background: #070d1e; border: 1px solid #1c2541; border-radius: 6px; padding: 8px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; max-height: 110px; overflow-y: auto; margin-top: 10px; }
  .history-box div { margin-bottom: 2px; }
</style>
</head>
<body>

<div class="table-container">
  <!-- 公牌區 -->
  <div class="board-section">
    <div style="font-size: 12px; color: #94a3b8;">本局運算公牌</div>
    <div class="symbol-board" id="sym-box">
      <div class="card-symbol">?</div><div class="card-symbol">?</div><div class="card-symbol">?</div>
    </div>
    <div class="pot-banner">底池：<span id="pot-display">0</span> ｜ 加注上限：<span id="cap-display">0</span></div>
  </div>

  <!-- 電腦 AI 區 -->
  <div class="player-zone">
    <div class="zone-header">
      <span>💻 電腦 AI</span>
      <span>籌碼：<span class="chips" id="ai-chips">100</span></span>
    </div>
    <div class="cards-row" id="ai-cards">
      <div class="card back"><span class="card-tag">底牌</span>?</div>
      <div class="card back"><span class="card-tag">明1</span>?</div>
    </div>
  </div>

  <!-- 玩家區 -->
  <div class="player-zone" style="border-color: #3b82f6;">
    <div class="zone-header">
      <span style="color: #60a5fa; font-weight: bold;">🧑 玩家（您）</span>
      <span>籌碼：<span class="chips" id="player-chips">100</span></span>
    </div>
    <div class="cards-row" id="player-cards">
      <div class="card back"><span class="card-tag">底牌</span>?</div>
      <div class="card back"><span class="card-tag">明1</span>?</div>
    </div>
  </div>

  <!-- 喊價操作面板 -->
  <div class="action-panel" id="betting-panel">
    <button class="btn-start" id="btn-start" onclick="startRound()">新回合 (底注10)</button>
    <button class="btn-call" id="btn-call" onclick="handleAction('call')" disabled>過牌 / 跟注</button>
    <input type="number" id="raise-input" placeholder="加注額" style="width: 75px;" disabled>
    <button class="btn-raise" id="btn-raise" onclick="handleAction('raise')" disabled>加注</button>
    <button class="btn-fold" id="btn-fold" onclick="handleAction('fold')" disabled>棄牌</button>
  </div>

  <!-- 玩家算式提交面板 (第四階段攤牌時開啟) -->
  <div class="formula-box" id="formula-box">
    <div style="font-size: 13px; font-weight: bold; color: var(--gold);">請組出算式（必須完整使用手牌4個數字與公牌3個符號，先乘除後加減）：</div>
    <div class="formula-input-row">
      <input type="text" id="player-formula-input" placeholder="例如: 8 * 2 + 5 - 1" style="flex: 1;">
      <button class="btn-start" onclick="submitPlayerFormula()">提交算式並對決</button>
    </div>
    <div style="font-size: 11px; color: #94a3b8;">快捷點擊按鈕輸入：</div>
    <div class="quick-buttons" id="quick-input-buttons"></div>
  </div>

  <div class="history-box" id="game-log">點擊「新回合」開始對決。</div>
</div>

<script>
const SYMBOLS = ['+', '-', '×', '÷'];
let pChips = 100, aiChips = 100, pot = 0;
let stage = 0; // 0: 未開始, 1: 1底1明, 2: 1底2明, 3: 1底3明(終局下注), 4: 攤牌輸入算式
let pHand = [], aiHand = [], currentSymbols = [];

function log(msg) {
  const box = document.getElementById('game-log');
  box.innerHTML += `<div>> ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

// 嚴格先乘除後加減
function evalTokens(nums, ops) {
  let curNums = [nums[0]];
  let curOps = [];

  for (let i = 0; i < ops.length; i++) {
    let op = ops[i];
    let nextNum = nums[i + 1];
    if (op === '×' || op === '÷') {
      let prevNum = curNums.pop();
      if (op === '÷') {
        if (nextNum === 0) return null;
        curNums.push(prevNum / nextNum);
      } else {
        curNums.push(prevNum * nextNum);
      }
    } else {
      curOps.push(op);
      curNums.push(nextNum);
    }
  }

  let res = curNums[0];
  for (let i = 0; i < curOps.length; i++) {
    let op = curOps[i];
    let next = curNums[i + 1];
    if (op === '+') res += next;
    else if (op === '-') res -= next;
  }
  return res;
}

// 電腦 AI 自動尋找最優解 (窮舉 144 種)
function solveBest(cards, symbols) {
  function perm(arr) {
    if (arr.length === 0) return [[]];
    let res = [];
    for (let i = 0; i < arr.length; i++) {
      let rest = perm(arr.slice(0, i).concat(arr.slice(i + 1)));
      for (let r of rest) res.push([arr[i], ...r]);
    }
    return res;
  }

  let cardPerms = perm(cards);
  let symPerms = perm(symbols);
  let best = { diff: Infinity, val: null, formula: "" };

  for (let pNums of cardPerms) {
    for (let pOps of symPerms) {
      let val = evalTokens(pNums, pOps);
      if (val !== null && !isNaN(val)) {
        let rounded = Math.round(val * 100) / 100;
        let diff = Math.min(Math.abs(rounded - 1), Math.abs(rounded - 20));
        diff = Math.round(diff * 100) / 100;
        if (diff < best.diff) {
          best = {
            diff: diff,
            val: rounded,
            formula: `${pNums[0]} ${pOps[0]} ${pNums[1]} ${pOps[1]} ${pNums[2]} ${pOps[2]} ${pNums[3]}`
          };
        }
      }
    }
  }
  return best;
}

// 驗證玩家自訂算式
function validateAndParsePlayerFormula(str) {
  let normalized = str.replace(/\*/g, '×').replace(/\//g, '÷').trim();
  let tokens = normalized.match(/\d+|[+\-×÷]/g);
  if (!tokens || tokens.length !== 7) {
    return { error: "格式錯誤！必須為：數字 符號 數字 符號 數字 符號 數字（4 個數字與 3 個符號交錯）" };
  }

  let nums = [];
  let ops = [];
  for (let i = 0; i < 7; i++) {
    if (i % 2 === 0) {
      let n = parseInt(tokens[i]);
      if (isNaN(n)) return { error: `第 ${i + 1} 個位置必須是數字！` };
      nums.push(n);
    } else {
      let op = tokens[i];
      if (!SYMBOLS.includes(op)) return { error: `第 ${i + 1} 個位置必須是運算符號！` };
      ops.push(op);
    }
  }

  // 驗證數字是否吻合手牌
  let userNumsSorted = [...nums].sort().join(',');
  let handNumsSorted = [...pHand].sort().join(',');
  if (userNumsSorted !== handNumsSorted) {
    return { error: `使用的數字 [${nums.join(', ')}] 與手牌 [${pHand.join(', ')}] 不符！` };
  }

  // 驗證符號是否吻合公牌
  let userOpsSorted = [...ops].sort().join(',');
  let boardOpsSorted = [...currentSymbols].sort().join(',');
  if (userOpsSorted !== boardOpsSorted) {
    return { error: `使用的符號 [${ops.join(' ')}] 與公牌 [${currentSymbols.join(' ')}] 不符！` };
  }

  let val = evalTokens(nums, ops);
  if (val === null) {
    return { error: "算式中發生除以 0 錯誤，無法計算！" };
  }

  let rounded = Math.round(val * 100) / 100;
  let diff = Math.min(Math.abs(rounded - 1), Math.abs(rounded - 20));
  diff = Math.round(diff * 100) / 100;

  return {
    val: rounded,
    diff: diff,
    formula: `${nums[0]} ${ops[0]} ${nums[1]} ${ops[1]} ${nums[2]} ${ops[2]} ${nums[3]}`
  };
}

function startRound() {
  if (pChips < 10 || aiChips < 10) {
    alert("其中一方籌碼不足，遊戲結束！");
    return;
  }
  pChips -= 10;
  aiChips -= 10;
  pot = 20;
  stage = 1;

  document.getElementById('formula-box').classList.remove('active');
  document.getElementById('player-formula-input').value = "";

  currentSymbols = [...SYMBOLS].sort(() => 0.5 - Math.random()).slice(0, 3);
  document.getElementById('sym-box').innerHTML = 
    currentSymbols.map(s => `<div class="card-symbol">${s}</div>`).join('');

  const draw = () => Math.floor(Math.random() * 10);
  pHand = [draw(), draw()];
  aiHand = [draw(), draw()];

  updateUI(false);
  log("【回合開始】各投底注 10。已開出 3 張公牌，發放 1 底牌 + 1 明牌。請下注！");
  toggleButtons(true);
}

function updateUI(showdown) {
  document.getElementById('player-chips').innerText = pChips;
  document.getElementById('ai-chips').innerText = aiChips;
  document.getElementById('pot-display').innerText = pot;
  document.getElementById('cap-display').innerText = Math.min(pChips, aiChips);

  const tags = ["底牌", "明1", "明2", "明3"];

  let pHtml = "";
  pHand.forEach((c, idx) => {
    let borderStyle = idx === 0 ? "border: 1.5px solid #3b82f6;" : "";
    pHtml += `<div class="card" style="${borderStyle}"><span class="card-tag">${tags[idx]}</span>${c}</div>`;
  });
  document.getElementById('player-cards').innerHTML = pHtml;

  let aiHtml = "";
  aiHand.forEach((c, idx) => {
    if (idx === 0 && !showdown) {
      aiHtml += `<div class="card back"><span class="card-tag">底牌</span>?</div>`;
    } else {
      let borderStyle = idx === 0 ? "border: 1.5px solid #ef4444;" : "";
      aiHtml += `<div class="card" style="${borderStyle}"><span class="card-tag">${tags[idx]}</span>${c}</div>`;
    }
  });
  document.getElementById('ai-cards').innerHTML = aiHtml;
}

function toggleButtons(active) {
  document.getElementById('btn-start').disabled = active;
  document.getElementById('btn-call').disabled = !active;
  document.getElementById('btn-raise').disabled = !active;
  document.getElementById('raise-input').disabled = !active;
  document.getElementById('btn-fold').disabled = !active;
}

function handleAction(action) {
  let cap = Math.min(pChips, aiChips);

  if (action === 'fold') {
    log("玩家棄牌！電腦收下底池 " + pot);
    aiChips += pot;
    finishRound();
    return;
  }

  if (action === 'raise') {
    let amt = parseInt(document.getElementById('raise-input').value) || 0;
    if (amt <= 0 || amt > cap) {
      alert(`加注額無效！請介於 1 到 ${cap} 之間。`);
      return;
    }
    pChips -= amt;
    aiChips -= amt;
    pot += (amt * 2);
    log(`玩家加注 ${amt}，電腦跟注。底池：${pot}`);
  } else {
    log("玩家選擇 過牌 / 跟注。");
  }

  const draw = () => Math.floor(Math.random() * 10);

  if (stage === 1) {
    stage = 2;
    pHand.push(draw());
    aiHand.push(draw());
    updateUI(false);
    log("發放明牌 2，進行第二輪下注。");
  } else if (stage === 2) {
    stage = 3;
    pHand.push(draw());
    aiHand.push(draw());
    updateUI(false);
    log("發放明牌 3，進行終局下注。");
  } else if (stage === 3) {
    // 進入算式輸入階段
    stage = 4;
    toggleButtons(false);
    document.getElementById('btn-start').disabled = true;
    document.getElementById('formula-box').classList.add('active');
    setupQuickButtons();
    log("【終局攤牌】請在下方組出您的最優算式！");
  }
}

function setupQuickButtons() {
  const container = document.getElementById('quick-input-buttons');
  container.innerHTML = "";

  // 數字按鈕
  pHand.forEach(num => {
    container.innerHTML += `<button type="button" class="quick-btn" onclick="appendFormula('${num} ')">${num}</button>`;
  });
  // 符號按鈕
  currentSymbols.forEach(sym => {
    container.innerHTML += `<button type="button" class="quick-btn" style="background:#d97706;" onclick="appendFormula('${sym} ')">${sym}</button>`;
  });
  // 清除按鈕
  container.innerHTML += `<button type="button" class="quick-btn" style="background:#ef4444;" onclick="clearFormula()">清除</button>`;
}

function appendFormula(val) {
  document.getElementById('player-formula-input').value += val;
}

function clearFormula() {
  document.getElementById('player-formula-input').value = "";
}

function submitPlayerFormula() {
  let inputStr = document.getElementById('player-formula-input').value;
  let pRes = validateAndParsePlayerFormula(inputStr);

  if (pRes.error) {
    alert(pRes.error);
    return;
  }

  // 關閉輸入面板並翻開電腦底牌
  document.getElementById('formula-box').classList.remove('active');
  updateUI(true);

  // 電腦自動窮舉最佳解
  let aiRes = solveBest(aiHand, currentSymbols);

  log(`═════════ 攤牌對決 ═════════`);
  log(`🧑 玩家算式：[ ${pRes.formula} ] = ${pRes.val} (離目標差距: ${pRes.diff})`);
  log(`💻 電腦算式：[ ${aiRes.formula} ] = ${aiRes.val} (離目標差距: ${aiRes.diff})`);

  if (pRes.diff < aiRes.diff) {
    log(`🏆 玩家獲勝！獨得底池 ${pot} 籌碼。`);
    pChips += pot;
  } else if (aiRes.diff < pRes.diff) {
    log(`💀 電腦獲勝！奪得底池 ${pot} 籌碼。`);
    aiChips += pot;
  } else {
    let half = Math.floor(pot / 2);
    log(`🤝 雙方差距一致 (${pRes.diff})，平分底池各得 ${half}。`);
    pChips += half;
    aiChips += half;
  }

  finishRound();
}

function finishRound() {
  pot = 0;
  stage = 0;
  updateUI(false);
  toggleButtons(false);
  document.getElementById('raise-input').value = '';

  if (pChips <= 0) {
    log("❌ 你的籌碼已輸光，電腦獲得最終勝利！");
    document.getElementById('btn-start').disabled = true;
  } else if (aiChips <= 0) {
    log("🎉 恭喜！電腦籌碼歸零，你贏得了梭哈大賽總冠軍！");
    document.getElementById('btn-start').disabled = true;
  }
}
</script>
</body>
</html>
