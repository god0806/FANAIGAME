
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看圖辨字：書法字體配對遊戲 (挑戰模式)</title>
<style>
    body {
        font-family: 'BiauKai', 'DFKai-SB', 'TW-Kai', 'PMingLiU', 'Times New Roman', serif;
        background-color: #f7f4ec;
        color: #2c2a29;
        text-align: center;
        margin: 0;
        padding: 20px 10px;
    }
    h1 { color: #8b2522; letter-spacing: 2px; margin-bottom: 5px; font-size: 24px; }
    p.instruction { color: #555; font-size: 16px; margin-bottom: 5px; }
    
    .status-bar {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
    }
    .errors-text { color: #d32f2f; }
    .success-text { color: #388e3c; }
    
    #message {
        font-size: 20px; font-weight: bold; color: #8b2522;
        height: 30px; margin: 5px 0 15px 0; letter-spacing: 1px;
    }
    
    .game-container {
        display: flex; justify-content: center; gap: 20px;
        max-width: 1000px; margin: 0 auto;
    }
    .column {
        flex: 1; display: flex; flex-direction: column; gap: 15px;
    }
    .col-title {
        font-size: 20px; font-weight: bold; color: #3b3a39;
        margin-bottom: 5px; border-bottom: 2px solid #d3cec4; padding-bottom: 10px;
    }
    
    /* 圖片卡片樣式 */
    .img-card {
        background-color: #fff; border: 3px solid #d3cec4; border-radius: 8px;
        padding: 10px; cursor: pointer; transition: all 0.2s ease-in-out;
        box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        display: flex; align-items: center; justify-content: center;
        height: 180px; 
    }
    .img-card img {
        max-width: 100%; max-height: 100%; object-fit: contain;
        pointer-events: none; 
    }
    
    /* 文字卡片樣式 */
    .text-card {
        background-color: #fff; border: 3px solid #d3cec4; border-radius: 8px;
        padding: 15px 20px; cursor: pointer; font-size: 17px; line-height: 1.5;
        transition: all 0.2s ease-in-out; box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 180px; user-select: none; box-sizing: border-box;
    }
    .text-card .font-name { font-size: 22px; font-weight: bold; color: #8b2522; margin-bottom: 8px; }
    
    /* 互動狀態 */
    .card:hover { border-color: #8b2522; transform: translateY(-2px); box-shadow: 2px 5px 10px rgba(0,0,0,0.1); }
    .card.selected {
        background-color: #fbeeed; border-color: #8b2522;
        box-shadow: 0 0 0 3px rgba(139, 37, 34, 0.3);
    }
    .card.matched {
        background-color: #e8f5e9; border-color: #4caf50; opacity: 0.5;
        pointer-events: none; box-shadow: none; filter: grayscale(50%);
    }
    .card.wrong { animation: shake 0.4s; background-color: #ffebee; border-color: #f44336; }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }
    
    .btn-restart {
        background-color: #8b2522; color: white; border: none; padding: 12px 30px;
        font-size: 18px; border-radius: 30px; cursor: pointer; font-family: inherit;
        letter-spacing: 2px; margin-top: 25px; transition: background-color 0.2s;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }
    .btn-restart:hover { background-color: #6a1b1a; }

    /* 遊戲結束的遮罩 */
    #overlay {
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
    }
    #overlay-message {
        color: white; font-size: 32px; font-weight: bold; margin-bottom: 20px;
        text-shadow: 2px 2px 4px #000;
    }
    
    @media (max-width: 768px) {
        .game-container { flex-direction: column; gap: 15px; }
        .img-card, .text-card { height: 140px; }
        .text-card { font-size: 15px; padding: 10px; }
        .text-card .font-name { font-size: 18px; }
    }
</style>
</head>

    </div>

            updateStatus();

            const shuffledImgs = shuffle([...pairs]);
            const shuffledTexts = shuffle([...pairs]);

            shuffledImgs.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card img-card';
                div.dataset.id = item.id;
                div.onclick = () => selectCard(div, 'img');
                
                const img = document.createElement('img');
                img.src = item.img;
                div.appendChild(img);
                
                imgCol.appendChild(div);
            });

            shuffledTexts.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card text-card';
                div.dataset.id = item.id;
                div.onclick = () => selectCard(div, 'text');
                
                div.innerHTML = `<div class="font-name">${item.name}</div><div>${item.desc}</div>`;
                textCol.appendChild(div);
            });
        }
        
        function updateStatus() {
            document.getElementById('match-count').innerText = matchedCount;
            document.getElementById('error-count').innerText = errorCount;
        }

        function selectCard(card, type) {
            if (isProcessing || card.classList.contains('matched')) return;
            document.getElementById('message').innerText = '配對中...';
            document.getElementById('message').style.color = '#8b2522';

            if (type === 'img') {
                if (selectedImg) selectedImg.classList.remove('selected');
                if (selectedImg === card) { selectedImg = null; return; }
                selectedImg = card;
                selectedImg.classList.add('selected');
            } else {
                if (selectedText) selectedText.classList.remove('selected');
                if (selectedText === card) { selectedText = null; return; }
                selectedText = card;
                selectedText.classList.add('selected');
            }

            if (selectedImg && selectedText) {
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const id1 = selectedImg.dataset.id;
            const id2 = selectedText.dataset.id;
            const card1 = selectedImg;
            const card2 = selectedText;

            if (id1 === id2) {
                // 答對
                card1.classList.remove('selected'); card2.classList.remove('selected');
                card1.classList.add('matched'); card2.classList.add('matched');
                matchedCount++;
                updateStatus();
                
                document.getElementById('message').innerText = '✅ 答對了！';
                document.getElementById('message').style.color = '#4caf50';
                
                if (matchedCount === pairs.length) {
                    setTimeout(() => {
                        document.getElementById('message').innerText = '🎉 太厲害了！挑戰成功！ 🎉';
                        document.getElementById('message').style.color = '#8b2522';
                    }, 400);
                }
                resetSelection();
            } else {
                // 答錯
                errorCount++;
                updateStatus();
                
                card1.classList.remove('selected'); card2.classList.remove('selected');
                card1.classList.add('wrong'); card2.classList.add('wrong');
                
                document.getElementById('message').innerText = '❌ 哎呀，配對錯誤！';
                document.getElementById('message').style.color = '#f44336';
                
                setTimeout(() => {
                    card1.classList.remove('wrong'); card2.classList.remove('wrong');
                    resetSelection();
                    
                    // 檢查是否達到重來條件
                    if (errorCount >= 2) {
                        showGameOver();
                    }
                }, 600);
            }
        }
        
        function resetSelection() {
            selectedImg = null; selectedText = null; isProcessing = false;
        }
        
        function showGameOver() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';
        }

        window.onload = initGame;
    </script>
</body>
</html>
