<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數戰空間：CS 實戰特勤訓練場 (跨裝置智能版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- 引入 Nipple.js 處理虛擬搖桿 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #121212; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
    
    .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; pointer-events: none; transition: transform 0.05s ease-out; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #00ff00; }
    .crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
    .crosshair::after { top: 0; left: 50%; width: 2px; height: 100%; transform: translateX(-50%); }
    .crosshair-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff0000; transform: translate(-50%, -50%); border-radius: 50%; }
    .crosshair.fire { transform: translate(-50%, -50%) scale(1.6); }
    .crosshair.locked::before, .crosshair.locked::after { background: #ff2222; box-shadow: 0 0 8px #ff0000; } /* 鎖定時變紅 */

    #damage-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; box-shadow: inset 0 0 0px rgba(239, 68, 68, 0); pointer-events: none; transition: box-shadow 0.2s; z-index: 15; }
    #damage-overlay.hurt { box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.9); }

    .screen-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
    #pause-screen { display: none; background: rgba(0, 0, 0, 0.85); z-index: 40; cursor: pointer; }
    #review-screen { display: none; background: rgba(15, 23, 42, 0.98); z-index: 60; }
    
    input[type=range] { accent-color: #38bdf8; cursor: pointer; }
    input[type=checkbox] { width: 1.2rem; height: 1.2rem; accent-color: #10b981; cursor: pointer; }
    
    #killfeed { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .kill-msg { background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 4px; color: white; font-family: monospace; font-size: 1.1rem; animation: fadeOut 4s forwards; border-right: 4px solid #10b981; }
    .kill-msg.error { border-right-color: #ef4444; }
    @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; display: none; } }

    /* 觸控 UI 樣式 */
    #touch-ui { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; pointer-events: auto; }
    #look-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; pointer-events: auto; }
    .touch-btn { pointer-events: auto; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.5); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.1s; }
    .touch-btn:active { background: rgba(255, 255, 255, 0.3); }
    #btn-fire { width: 80px; height: 80px; background: rgba(225, 29, 72, 0.4); border-color: #e11d48; }
    #btn-fire:active { background: rgba(225, 29, 72, 0.7); }
    #btn-jump { width: 60px; height: 60px; }
    #btn-crouch { width: 60px; height: 60px; }
    #btn-pause-mobile { position: absolute; top: 20px; right: 20px; padding: 8px 16px; background: rgba(0,0,0,0.5); border: 1px solid white; color: white; border-radius: 8px; pointer-events: auto; font-weight: bold; z-index: 30; }

    .custom-scroll::-webkit-scrollbar { width: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    /* 清楚、穩定的作戰 HUD */
    :root { color-scheme: dark; }
    .screen-overlay { padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
    #ui-layer > .absolute.bg-slate-900\/90 { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(9, 18, 32, .82); }
    #hud-question { text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.65); }
    .crosshair::before, .crosshair::after { box-shadow: 0 0 6px rgba(0,0,0,.9); }
    #joystick-zone { bottom: max(20px, env(safe-area-inset-bottom)); left: max(20px, env(safe-area-inset-left)); }
    #btn-pause-mobile { top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); }
    @media (max-width: 640px) {
      #ui-layer .absolute.top-4.left-4 { max-width: calc(100vw - 2rem); padding: .7rem .85rem; }
      #hud-question { font-size: clamp(1rem, 4.6vw, 1.45rem); line-height: 1.3; }
      #ui-layer .absolute.bottom-4.left-4 { gap: .5rem; }
      #ui-layer .absolute.bottom-4.left-4 > div { min-width: 4.4rem; padding: .5rem; }
      #ui-layer .absolute.bottom-4.left-4 > div > div:last-child { font-size: 1.6rem; }
      .touch-btn { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    }
  </style>
</head>
<body>

  <!-- 設定與上傳畫面 -->
  <div id="setup-screen" class="screen-overlay overflow-y-auto py-8">
    <h1 class="text-4xl md:text-6xl font-black text-white mb-2 md:mb-4 tracking-wider italic text-center">TACTICAL <span class="text-sky-500">MATH</span></h1>
    <p class="text-emerald-400 font-bold mb-4" id="device-info">系統偵測中...</p>
    
    <div class="flex flex-col md:flex-row gap-6 mb-6 w-full max-w-4xl px-4 items-stretch">
      <!-- 說明 -->
      <div class="text-slate-300 md:w-1/3 leading-relaxed bg-slate-800/50 p-6 rounded-xl border border-slate-600 shadow-lg text-sm md:text-base">
        <div class="font-bold text-rose-400 mb-2 text-lg border-b border-slate-700 pb-2">【特勤作戰指令】</div>
        <span class="text-white font-bold">電腦端</span>: WASD 移動，滑鼠瞄準與左鍵射擊，空白鍵跳躍，Shift 蹲下。<br><br>
        <span class="text-white font-bold">手機平板</span>: 左搖桿移動，右半螢幕滑動瞄準，按鈕操作跳躍/蹲下/開火。
      </div>

      <!-- 地圖與難度設定 -->
      <div class="bg-slate-900 md:w-2/3 p-6 rounded-xl border border-slate-600 shadow-lg flex flex-col justify-between">
        
        <div class="flex flex-col sm:flex-row gap-4 mb-4">
          <div class="flex-1">
            <label class="text-sky-400 font-bold mb-1 block">作戰區域 (地圖)：</label>
            <select id="map-select" class="w-full bg-slate-800 text-white font-bold px-3 py-2 rounded outline-none border border-sky-500">
              <option value="bloodstrike" selected>血戰競技場 (經典緊湊)</option>
              <option value="dust">沙漠遺跡 (高低落差)</option>
              <option value="iceworld">極地交鋒 (極近距離)</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="text-amber-400 font-bold mb-1 block">戰鬥難易度：</label>
            <select id="difficulty-select" class="w-full bg-slate-800 text-white font-bold px-3 py-2 rounded outline-none border border-amber-500">
              <option value="easy">簡單 (固定靶 / 射速慢)</option>
              <option value="normal" selected>標準 (會找掩體 / 射速中)</option>
              <option value="hard">困難 (包抄極快 / 射速高)</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-6 mb-4">
          <div class="flex-1">
            <label class="text-slate-200 font-bold mb-1 flex justify-between text-sm">
              <span>敵人移動速度</span> <span id="speed-val" class="text-sky-400">4.0</span>
            </label>
            <input type="range" id="speed-slider" min="0" max="12" step="0.5" value="4.0" class="w-full">
          </div>
          <div class="flex-1">
            <label class="text-slate-200 font-bold mb-1 flex justify-between text-sm">
              <span>敵人開火間隔</span> <span id="fire-val" class="text-sky-400">2.0 秒</span>
            </label>
            <input type="range" id="fire-slider" min="0.5" max="5.0" step="0.1" value="2.0" class="w-full">
          </div>
        </div>

        <!-- 輔助瞄準開關 -->
        <div class="bg-slate-800/80 p-3 rounded-lg border border-emerald-500/50 flex items-center gap-3">
          <input type="checkbox" id="auto-aim-toggle" checked>
          <label for="auto-aim-toggle" class="text-white font-bold cursor-pointer select-none">開啟自動輔助瞄準 (Auto-Aim)</label>
        </div>
      </div>
    </div>

    <button id="quick-start-btn" class="mb-4 px-10 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xl md:text-2xl transition-all shadow-lg border-2 border-emerald-400">
      ▶ 進入實戰演練 (測試題庫)
    </button>
    
    <div class="w-full max-w-2xl border-t border-slate-700 my-2"></div>

    <p class="text-slate-400 text-sm mb-4 mt-2 px-4 text-center">上傳自訂 CSV 題庫 (必備欄位: 題號, 題目, 選項A...D, 正確答案)</p>
    <label class="mb-6 cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-500 text-white px-6 py-2 rounded-lg transition-all">
      <span id="file-name">選擇 CSV 檔案</span>
      <input type="file" id="csv-upload" accept=".csv" class="hidden">
    </label>
    <button id="start-btn" class="px-8 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold text-lg transition-all hidden">載入出擊</button>
  </div>

  <!-- 暫停畫面 -->
  <div id="pause-screen" class="screen-overlay">
    <h2 class="text-4xl md:text-6xl font-black text-white mb-6 tracking-widest drop-shadow-2xl">遊戲暫停</h2>
    <div class="text-xl md:text-2xl text-white font-bold bg-sky-600/80 hover:bg-sky-500 px-8 py-4 rounded-xl border-2 border-sky-400 transition-all shadow-[0_0_20px_rgba(14,165,233,0.8)] text-center">
      點擊此處返回戰場<br><span class="text-sm font-normal">(Click to Resume)</span>
    </div>
  </div>

  <!-- 錯題檢討畫面 -->
  <div id="review-screen" class="screen-overlay px-4">
    <h2 class="text-4xl md:text-5xl font-black text-white mb-2 text-center" id="review-title">MISSION OVER</h2>
    <p class="text-lg md:text-xl text-slate-300 mb-6 text-center">戰術結算與錯題檢討</p>
    
    <div class="bg-slate-800 border border-slate-600 rounded-lg p-4 md:p-6 w-full max-w-3xl mb-8 shadow-2xl">
      <h3 class="text-amber-400 font-bold text-xl md:text-2xl mb-4 border-b border-slate-700 pb-2">誤擊紀錄 (錯題本)</h3>
      <ul id="mistake-list" class="max-h-[40vh] overflow-y-auto custom-scroll pr-4 space-y-4">
        <!-- 錯題將透過 JS 動態產生於此 -->
      </ul>
    </div>

    <button id="restart-btn" class="px-8 md:px-10 py-3 md:py-4 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-bold text-xl md:text-2xl transition-all shadow-lg border-2 border-sky-400">
      返回指揮部 (重新開始)
    </button>
  </div>

  <div id="damage-overlay"></div>
  <div id="canvas-container"></div>

  <!-- 觸控 UI 層 -->
  <div id="touch-ui">
    <button id="btn-pause-mobile">❚❚ 暫停</button>
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <div style="position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; align-items: flex-end; pointer-events: none;">
      <div id="btn-crouch" class="touch-btn">蹲</div>
      <div id="btn-jump" class="touch-btn">跳</div>
      <div id="btn-fire" class="touch-btn">射擊</div>
    </div>
  </div>

  <div id="ui-layer">
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-white/50 font-bold text-lg md:text-xl tracking-widest" id="stance-indicator">[ STANDING ]</div>

    <div class="absolute top-4 left-4 md:bottom-8 md:top-auto md:left-8 bg-slate-900/90 border-l-4 border-amber-500 p-3 md:p-6 rounded text-white shadow-2xl max-w-xs md:max-w-4xl">
      <div class="text-sm md:text-lg text-amber-400 font-bold mb-1" id="hud-question-number">MISSION OBJECTIVE</div>
      <div class="text-xl md:text-4xl font-mono leading-tight font-bold" id="hud-question">等待任務指派...</div>
    </div>

    <div class="absolute bottom-4 left-4 md:bottom-8 md:left-auto md:right-8 flex gap-3 md:gap-6">
      <div class="bg-slate-900/90 border-b-4 border-rose-500 p-2 md:p-4 rounded text-center min-w-[80px] md:min-w-[140px] shadow-2xl">
        <div class="text-xs md:text-lg text-slate-400 font-bold mb-1">ARMOR</div>
        <div class="text-2xl md:text-5xl font-black text-rose-500" id="hud-hp">100</div>
      </div>
      <div class="bg-slate-900/90 border-b-4 border-sky-500 p-2 md:p-4 rounded text-center min-w-[80px] md:min-w-[140px] shadow-2xl">
        <div class="text-xs md:text-lg text-slate-400 font-bold mb-1">SCORE</div>
        <div class="text-2xl md:text-5xl font-black text-sky-400" id="hud-score">0</div>
      </div>
    </div>
    
    <div class="crosshair" id="crosshair"><div class="crosshair-dot"></div></div>
    <!-- 隱藏電腦版右上角，以免跟觸控暫停重疊 -->
    <div id="killfeed" class="hidden md:flex"></div> 
  </div>

  <script>
    // ==========================================
    // 0. 裝置偵測與全域設定
    // ==========================================
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    document.getElementById('device-info').textContent = isTouchDevice ? "✓ 偵測為觸控裝置 (啟用雙搖桿模式)" : "✓ 偵測為電腦端 (啟用鍵鼠 FPS 模式)";

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let hp = 100;
    let isTransitioning = false; 
    let isGameStarted = false;
    let isGameOver = false;
    let isPaused = false;
    let wrongAnswersLog = [];

    // 動態難易度與輔助瞄準
    let enemyMoveSpeed = 4.0;
    let enemyFireBase = 2000;
    let enemyFireRand = 1000;
    let enemyBulletSpeed = 40.0;
    let autoAimEnabled = true;

    document.getElementById('speed-slider').addEventListener('input', (e) => { document.getElementById('speed-val').textContent = parseFloat(e.target.value).toFixed(1); });
    document.getElementById('fire-slider').addEventListener('input', (e) => { document.getElementById('fire-val').textContent = parseFloat(e.target.value).toFixed(1) + ' 秒'; });

    document.getElementById('difficulty-select').addEventListener('change', (e) => {
      const diff = e.target.value;
      const speedSlider = document.getElementById('speed-slider');
      const fireSlider = document.getElementById('fire-slider');
      if (diff === 'easy') { speedSlider.value = 0; fireSlider.value = 4.0; }
      else if (diff === 'normal') { speedSlider.value = 4.0; fireSlider.value = 2.0; }
      else if (diff === 'hard') { speedSlider.value = 8.0; fireSlider.value = 0.8; }
      document.getElementById('speed-val').textContent = parseFloat(speedSlider.value).toFixed(1);
      document.getElementById('fire-val').textContent = parseFloat(fireSlider.value).toFixed(1) + ' 秒';
    });

    const fileInput = document.getElementById('csv-upload');
    const fileNameDisplay = document.getElementById('file-name');
    const startBtn = document.getElementById('start-btn');
    const quickStartBtn = document.getElementById('quick-start-btn');
    const restartBtn = document.getElementById('restart-btn');

    const testData = [
      { '題號': 1, '題目': '目標: 計算 |-8| + |-3| = ?', '選項A': '5', '選項B': '-5', '選項C': '11', '選項D': '-11', '正確答案': '11' },
      { '題號': 2, '題目': '解除武裝: 3x - 5 = 10，x = ?', '選項A': '5', '選項B': '-5', '選項C': '15', '選項D': '-15', '正確答案': '5' },
      { '題號': 3, '題目': '陣地戰: -15 - (-7) = ?', '選項A': '-22', '選項B': '-8', '選項C': '8', '選項D': '22', '正確答案': '-8' }
    ];

    function applySettings() {
      enemyMoveSpeed = parseFloat(document.getElementById('speed-slider').value);
      enemyFireBase = parseFloat(document.getElementById('fire-slider').value) * 1000;
      enemyFireRand = enemyFireBase * 0.5; 
      const diff = document.getElementById('difficulty-select').value;
      enemyBulletSpeed = (diff === 'hard') ? 70.0 : ((diff === 'easy') ? 25.0 : 45.0);
      autoAimEnabled = document.getElementById('auto-aim-toggle').checked;
    }

    function startGameWithData(data) {
      applySettings(); 
      questions = data;
      
      currentQuestionIndex = 0;
      score = 0;
      hp = 100;
      wrongAnswersLog = [];
      isGameOver = false;
      isPaused = false;
      document.getElementById('hud-hp').textContent = hp;
      document.getElementById('hud-score').textContent = score;

      const selectedMap = document.getElementById('map-select').value;
      buildMap(selectedMap);
      yVelocity = 0;

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('ui-layer').style.display = 'block';
      
      if (isTouchDevice) {
        document.getElementById('touch-ui').style.display = 'block';
        initTouchControls();
      } else {
        document.body.requestPointerLock();
      }

      isGameStarted = true;
      prevTime = performance.now();
      loadNextQuestion();
    }

    quickStartBtn.addEventListener('click', () => { startGameWithData(testData); });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameDisplay.textContent = file.name;
        Papa.parse(file, {
          header: true, skipEmptyLines: true, transformHeader: h => h.trim(),
          complete: function(results) {
            const validData = results.data.filter(q => q['題目'] !== undefined && q['正確答案'] !== undefined);
            if (validData.length > 0) {
              questions = validData;
              startBtn.classList.remove('hidden');
            } else {
              alert(`檔案解析失敗！找不到「題目」或「正確答案」欄位。`);
            }
          }
        });
      }
    });

    startBtn.addEventListener('click', () => { if (questions.length > 0) startGameWithData(questions); });

    restartBtn.addEventListener('click', () => {
      document.getElementById('review-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'flex';
      agentGroup.clear();
      agents.length = 0;
    });

    let prevTime = performance.now();
    
    // 電腦端暫停處理
    document.addEventListener('pointerlockchange', () => {
      if (!isTouchDevice && !isGameOver && isGameStarted) {
        if (document.pointerLockElement !== document.body) {
          isPaused = true;
          document.getElementById('pause-screen').style.display = 'flex';
        } else {
          isPaused = false;
          document.getElementById('pause-screen').style.display = 'none';
          prevTime = performance.now();
        }
      }
    });

    // 行動端暫停按鈕
    document.getElementById('btn-pause-mobile').addEventListener('click', () => {
      isPaused = true;
      document.getElementById('pause-screen').style.display = 'flex';
      document.getElementById('touch-ui').style.display = 'none';
    });

    // 恢復遊戲
    document.getElementById('pause-screen').addEventListener('click', () => {
      if (!isGameOver && isGameStarted && hp > 0) {
        isPaused = false;
        document.getElementById('pause-screen').style.display = 'none';
        prevTime = performance.now();
        if (isTouchDevice) {
          document.getElementById('touch-ui').style.display = 'block';
        } else {
          document.body.requestPointerLock();
        }
      }
    });

    function showReviewScreen(titleText) {
      isGameOver = true;
      if(!isTouchDevice) document.exitPointerLock();
      document.getElementById('pause-screen').style.display = 'none';
      document.getElementById('ui-layer').style.display = 'none';
      document.getElementById('touch-ui').style.display = 'none';
      
      const reviewScreen = document.getElementById('review-screen');
      document.getElementById('review-title').textContent = titleText;
      
      const listEl = document.getElementById('mistake-list');
      listEl.innerHTML = '';

      if (wrongAnswersLog.length === 0) {
        listEl.innerHTML = `<li class="text-emerald-400 font-bold text-xl py-4 text-center">🏆 太神啦！特戰菁英，無任何錯題！</li>`;
      } else {
        wrongAnswersLog.forEach(log => {
          listEl.innerHTML += `
            <li class="mb-3 bg-slate-700/50 p-4 rounded-lg border-l-4 border-rose-500">
              <div class="text-slate-200 text-lg mb-2">📡 任務: <span class="font-bold">${log.question}</span></div>
              <div class="grid grid-cols-2 gap-4 text-md">
                <div class="text-emerald-400">✅ 正解: <span class="font-bold">${log.correct}</span></div>

    // ==========================================

    let collidableObjects = [];

    function createMapElement(geo, mat, x, y, z, rotX = 0, rotY = 0, rotZ = 0) {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotX, rotY, rotZ);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mapGroup.add(mesh);
      collidableObjects.push(mesh);
      terrainObjects.push(mesh);
      return mesh;
    }

    function clearMap() {
      mapGroup.clear();
      collidableObjects.length = 0;
      terrainObjects.length = 0;
      currentEnemySpawns = [];
    }

    function buildMap(type) {
      clearMap();
      if (type === 'bloodstrike') {
        createMapElement(new THREE.BoxGeometry(60, 1, 60), bloodGroundMat, 0, -0.5, 0); 
        createMapElement(new THREE.BoxGeometry(60, 15, 2), bloodWallMat, 0, 7.5, -30);

        createMapElement(new THREE.BoxGeometry(4, 5, 4), iceWallMat, 10, 2.5, 10);
        createMapElement(new THREE.BoxGeometry(4, 5, 4), iceWallMat, -10, 2.5, 10);

    // ==========================================
    // 3. 機甲生成邏輯
    // ==========================================
    const agents = [];
    const projectiles = []; 
    const agentGroup = new THREE.Group();
    scene.add(agentGroup);

    function createHoloBoardTexture(text, bgColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = 'white'; ctx.lineWidth = 10; ctx.strokeRect(6, 6, 500, 244); 
      ctx.fillStyle = 'white'; 
      ctx.font = `bold ${String(text).length > 4 ? 80 : 120}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 128); 
      return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.9, emissive: bgColor, emissiveIntensity: 0.5 });
    }

    function createHumanAgent(text, isCorrect) {
      const human = new THREE.Group();
      
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 }); 
      const vestMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }); 
      const shirtMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.8 }); 
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 }); 
      const weaponMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8 });
      const armorMat = new THREE.MeshStandardMaterial({ color: 0x27352c, roughness: 0.78, metalness: 0.12 });
      const trimMat = new THREE.MeshStandardMaterial({ color: 0xd2a64b, roughness: 0.55, metalness: 0.35 });
      const visorMat = new THREE.MeshStandardMaterial({ color: 0x14232b, roughness: 0.22, metalness: 0.55, emissive: 0x12313a, emissiveIntensity: 0.35 });
      const clothMat = new THREE.MeshStandardMaterial({ color: 0x66735a, roughness: 0.95 });
      const agentGeometryCache = createHumanAgent.geometryCache || (createHumanAgent.geometryCache = new Map());
      const hitMeshes = [];
      const addPart = (w, h, d, material, x, y, z, rz = 0, rx = 0) => {
        const key = `${w}:${h}:${d}`;
        if (!agentGeometryCache.has(key)) agentGeometryCache.set(key, new THREE.BoxGeometry(w, h, d));
        const mesh = new THREE.Mesh(agentGeometryCache.get(key), material);
        mesh.position.set(x, y, z); mesh.rotation.set(rx, 0, rz);
        mesh.castShadow = true; mesh.receiveShadow = true; human.add(mesh); hitMeshes.push(mesh);
        return mesh;
      };

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), vestMat);
      torso.position.y = 1.8; torso.castShadow = true; human.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
      head.position.y = 2.7; head.castShadow = true; human.add(head);

      const leftLeg = new THREE.Group();
      leftLeg.position.set(-0.25, 1.2, 0); 
      const lLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 0.35), pantsMat);
      lLegMesh.position.y = -0.6; lLegMesh.castShadow = true; leftLeg.add(lLegMesh);
      human.add(leftLeg);

      const rightLeg = new THREE.Group();
      rightLeg.position.set(0.25, 1.2, 0);
      const rLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 0.35), pantsMat);
      rLegMesh.position.y = -0.6; rLegMesh.castShadow = true; rightLeg.add(rLegMesh);
      human.add(rightLeg);

      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), shirtMat);
      leftArm.position.set(-0.65, 1.9, 0); leftArm.rotation.z = Math.PI / 16; human.add(leftArm);

      const rightArm = new THREE.Group();
      rightArm.position.set(0.6, 2.2, 0); 
      const rArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), shirtMat);
      rArmMesh.position.set(0, -0.2, 0.4); rArmMesh.rotation.x = -Math.PI / 2.2; rightArm.add(rArmMesh);
      const gun = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.8), weaponMat);
      gun.position.set(0, -0.2, 0.9); rightArm.add(gun); human.add(rightArm);

      // 頭盔、護目鏡與面罩
      const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 8), armorMat);
      helmet.scale.set(1, 0.78, 0.9); helmet.position.set(0, 2.94, 0); helmet.castShadow = true; human.add(helmet); hitMeshes.push(helmet);
      addPart(0.42, 0.17, 0.045, visorMat, 0, 2.77, 0.263);
      addPart(0.30, 0.16, 0.30, clothMat, 0, 2.57, 0.02);
      addPart(0.38, 0.055, 0.38, trimMat, 0, 2.58, 0.04);
      // 胸甲、肩甲、識別燈與戰術背心口袋
      addPart(0.68, 0.68, 0.12, armorMat, 0, 1.88, 0.29);
      addPart(0.10, 0.72, 0.045, clothMat, -0.20, 1.87, 0.36, -0.28);
      addPart(0.10, 0.72, 0.045, clothMat, 0.20, 1.87, 0.36, 0.28);
      addPart(0.20, 0.09, 0.055, trimMat, 0, 2.05, 0.37);
      addPart(0.16, 0.07, 0.06, visorMat, 0, 1.91, 0.38);
      addPart(0.36, 0.33, 0.37, armorMat, -0.60, 2.30, 0, -0.12);
      addPart(0.36, 0.33, 0.37, armorMat, 0.60, 2.30, 0, 0.12);
      addPart(0.25, 0.28, 0.16, clothMat, -0.37, 1.52, 0.28);
      addPart(0.25, 0.28, 0.16, clothMat, 0.37, 1.52, 0.28);
      addPart(0.96, 0.13, 0.56, weaponMat, 0, 1.23, 0);
      addPart(0.14, 0.16, 0.12, trimMat, -0.37, 1.23, 0.30);
      addPart(0.14, 0.16, 0.12, trimMat, 0.37, 1.23, 0.30);
      // 護膝與軍靴，讓下半身輪廓更清楚
      addPart(0.39, 0.27, 0.39, armorMat, -0.25, 0.68, 0.12);
      addPart(0.39, 0.27, 0.39, armorMat, 0.25, 0.68, 0.12);
      addPart(0.39, 0.26, 0.62, weaponMat, -0.25, 0.12, 0.11);
      addPart(0.39, 0.26, 0.62, weaponMat, 0.25, 0.12, 0.11);
      // 步槍加上瞄具、握把與槍口
      addPart(0.14, 0.10, 0.20, visorMat, 0.60, 2.16, 0.78);
      addPart(0.12, 0.15, 0.18, weaponMat, 0.60, 1.83, 0.90, 0.18);
      addPart(0.12, 0.12, 0.18, trimMat, 0.60, 2.00, 1.31);

      const boardMat = createHoloBoardTexture(text, 'rgba(14, 165, 233, 0.8)');
      const board = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.5), boardMat);
      board.position.y = 4.0; human.add(board);

      human.userData = { 
        text: text, isCorrect: isCorrect, originalColor: 'rgba(14, 165, 233, 0.8)',
        boardMesh: board, gunMesh: gun, leftLeg: leftLeg, rightLeg: rightLeg, hitMeshes,
        walkOffset: Math.random() * Math.PI * 2, 
        lastShootTime: performance.now() + 1000 + Math.random() * 2000,
        yVelocity: 0 
      };
      
      // 修復：將敵人的所有部位加入碰撞偵測，確保子彈能打到
      hitMeshes.push(torso, head, lLegMesh, rLegMesh, leftArm, rArmMesh, gun, board);
      collidableObjects.push(...hitMeshes);
      return human;
    }

    function loadNextQuestion() {
      if (currentQuestionIndex >= questions.length) {
        showReviewScreen("MISSION ACCOMPLISHED! 訓練完成");
        return;
      }

      const qData = questions[currentQuestionIndex];
      document.getElementById('hud-question-number').textContent = `MISSION NO. ${qData['題號'] || (currentQuestionIndex+1)}`;
      document.getElementById('hud-question').textContent = qData['題目'];

      agents.forEach(agent => {
        (agent.userData.hitMeshes || []).forEach(mesh => {
          const idx = collidableObjects.indexOf(mesh);
          if (idx > -1) collidableObjects.splice(idx, 1);
        });
      });
      agentGroup.clear(); 
      agents.length = 0;
      projectiles.forEach(p => scene.remove(p)); projectiles.length = 0;
      isTransitioning = false;

      const options = [
        { text: qData['選項A'] || '-', isCorrect: false },
        { text: qData['選項B'] || '-', isCorrect: false },
        { text: qData['選項C'] || '-', isCorrect: false },
        { text: qData['選項D'] || '-', isCorrect: false }
      ];

      const ansKey = String(qData['正確答案']).trim().toUpperCase();
      const ansMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
      if (ansMap[ansKey] !== undefined) {
        options[ansMap[ansKey]].isCorrect = true; 
      } else {
        options.forEach(opt => { if (String(opt.text).trim() === String(qData['正確答案']).trim()) opt.isCorrect = true; });
      }
      options.sort(() => Math.random() - 0.5); 

      const shuffledSpawns = [...currentEnemySpawns].sort(() => 0.5 - Math.random());

      options.forEach((opt, index) => {
        const agent = createHumanAgent(opt.text, opt.isCorrect);
        const spawnPoint = shuffledSpawns[index % shuffledSpawns.length];
        agent.position.set(spawnPoint.x, spawnPoint.y, spawnPoint.z);
        agentGroup.add(agent);
        agents.push(agent);
      });
    }

    function addKillfeed(msg, isError = false) {
      const feed = document.getElementById('killfeed');
      const el = document.createElement('div');
      el.className = `kill-msg ${isError ? 'error' : ''}`;
      el.textContent = msg;
      feed.appendChild(el);
      // 手機版 killfeed 可以適度縮短時間避免擋視線
      setTimeout(() => feed.removeChild(el), isTouchDevice ? 2500 : 4000);
    }

    // ==========================================
    // 4. 武器系統與傷害
    // ==========================================
    const projectileGeo = new THREE.SphereGeometry(0.15, 8, 8); 
    const projectileMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 }); 

    function enemyShoot(agent) {
      if (isTransitioning) return;
      const bullet = new THREE.Mesh(projectileGeo, projectileMat);
      
      const startPos = new THREE.Vector3();
      agent.userData.gunMesh.getWorldPosition(startPos);
      bullet.position.copy(startPos);

      const direction = new THREE.Vector3();
      direction.subVectors(camera.position, startPos).normalize();
      
      bullet.userData = { velocity: direction.multiplyScalar(enemyBulletSpeed), aliveTimer: 2.0 }; 
      scene.add(bullet); projectiles.push(bullet);
    }

    function takeDamage(amount) {
      if(isTransitioning || hp <= 0) return;
      hp = Math.max(0, hp - amount);
      document.getElementById('hud-hp').textContent = hp;
      
      const damageOverlay = document.getElementById('damage-overlay');
      damageOverlay.classList.add('hurt');
      setTimeout(() => damageOverlay.classList.remove('hurt'), 300);
      
      if (hp <= 0) {
        showReviewScreen("KIA 任務失敗 (陣亡)");
      }
    }

    function fireWeapon() {
      if (hp <= 0 || isTransitioning || isGameOver || isPaused) return;

      const crosshair = document.getElementById('crosshair');
      crosshair.classList.add('fire');
      setTimeout(() => crosshair.classList.remove('fire'), 80);
      
      euler.setFromQuaternion(camera.quaternion);
      euler.x += 0.015; 
      camera.quaternion.setFromEuler(euler);

      raycaster.setFromCamera(screenCenter, camera);
      const checkObjects = [...collidableObjects];
      const intersects = raycaster.intersectObjects(checkObjects, true);

      if (intersects.length > 0) {
        let hitObj = intersects[0].object;
        let parentObj = hitObj;
        
        while (parentObj && parentObj.userData === undefined && parentObj.parent) {
          parentObj = parentObj.parent;
        }

        while (parentObj && parentObj.userData && parentObj.userData.text === undefined && parentObj.parent) {
          parentObj = parentObj.parent;
        }
        
        if (parentObj && parentObj.userData && parentObj.userData.text !== undefined) {
          const aData = parentObj.userData;
          const board = aData.boardMesh;

          if (aData.isCorrect) {
            board.material = createHoloBoardTexture(aData.text, 'rgba(16, 185, 129, 0.9)'); 
            score += 100;
            document.getElementById('hud-score').textContent = score;
            addKillfeed(`✓ 擊斃目標 [${aData.text}]`);
            isTransitioning = true;
            aData.dying = true;
            currentQuestionIndex++;
            setTimeout(loadNextQuestion, 1500); 
          } else {
            board.material = createHoloBoardTexture(aData.text, 'rgba(239, 68, 68, 0.9)'); 
            
            const currentQ = questions[currentQuestionIndex];
            const alreadyLogged = wrongAnswersLog.find(w => w.qIndex === currentQuestionIndex);
            if(!alreadyLogged) {
              wrongAnswersLog.push({
                qIndex: currentQuestionIndex,
                question: currentQ['題目'],
                correct: currentQ['正確答案'],
                picked: aData.text
              });
            }

            takeDamage(20);
            score = Math.max(0, score - 50);
            document.getElementById('hud-score').textContent = score;
            addKillfeed(`✕ 誤殺平民 [${aData.text}]`, true);
            setTimeout(() => { if (!aData.dying) board.material = createHoloBoardTexture(aData.text, aData.originalColor); }, 500);
          }
        }
      }
    }

    // ==========================================
    // 5. FPS 操作與碰撞
    // ==========================================
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    const keys = { w: false, a: false, s: false, d: false, jump: false, crouch: false };
    let joystickVector = new THREE.Vector2(0, 0);

    let yVelocity = 0;
    const gravity = -60.0;
    const jumpSpeed = 22.0;

    // PC 滑鼠與鍵盤
    document.addEventListener('mousemove', (e) => {
      if (!isTouchDevice && document.pointerLockElement === document.body && !isGameOver && !isPaused && hp > 0) {
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= e.movementX * 0.002; 
        euler.x -= e.movementY * 0.002; 
        euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
        camera.quaternion.setFromEuler(euler);
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
      if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
      if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
      if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
      if(e.code === 'Space') keys.jump = true;
      if(e.code === 'ShiftLeft' || e.code === 'KeyC') keys.crouch = true;
    });
    
    document.addEventListener('keyup', (e) => {
      if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
      if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
      if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
      if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
      if(e.code === 'Space') keys.jump = false;
      if(e.code === 'ShiftLeft' || e.code === 'KeyC') keys.crouch = false;
    });

    const raycaster = new THREE.Raycaster();
    const screenCenter = new THREE.Vector2(0, 0);

    // PC 滑鼠開火
    document.addEventListener('mousedown', (e) => {
      if (!isTouchDevice && document.pointerLockElement === document.body) {
        if (e.button === 0) fireWeapon(); 
      }
    });

    // 行動端觸控設定
    let touchControlsInitialized = false;
    function initTouchControls() {
      if (touchControlsInitialized) return;
      touchControlsInitialized = true;
      // 虛擬搖桿 (移動)
      const joystickManager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '50%', top: '50%' }, color: '#38bdf8' });
      joystickManager.on('move', (evt, data) => { joystickVector.set(data.vector.x, data.vector.y); });
      joystickManager.on('end', () => { joystickVector.set(0, 0); });

      // 右半螢幕滑動 (視角)
      let lastTouchX = 0, lastTouchY = 0, lookTouchId = null;
      const lookZone = document.getElementById('look-zone');
      lookZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++){
          if(lookTouchId === null) {
            lookTouchId = e.changedTouches[i].identifier;
            lastTouchX = e.changedTouches[i].clientX;
            lastTouchY = e.changedTouches[i].clientY;
          }
        }
      }, { passive: false });

      lookZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(isPaused || isGameOver) return;
        for(let i=0; i<e.changedTouches.length; i++){
          if(e.changedTouches[i].identifier === lookTouchId) {
            const touch = e.changedTouches[i];
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= (touch.clientX - lastTouchX) * 0.005; // 觸控靈敏度
            euler.x -= (touch.clientY - lastTouchY) * 0.005;
            euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
            camera.quaternion.setFromEuler(euler);
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
          }
        }
      }, { passive: false });

      lookZone.addEventListener('touchend', (e) => {
        for(let i=0; i<e.changedTouches.length; i++){
          if(e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
        }
      });

      // 觸控按鈕
      const btnJump = document.getElementById('btn-jump');
      btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); keys.jump = true; });
      btnJump.addEventListener('touchend', (e) => { e.preventDefault(); keys.jump = false; });
      
      const btnCrouch = document.getElementById('btn-crouch');
      btnCrouch.addEventListener('touchstart', (e) => { e.preventDefault(); keys.crouch = true; });
      btnCrouch.addEventListener('touchend', (e) => { e.preventDefault(); keys.crouch = false; });

      const btnFire = document.getElementById('btn-fire');
      btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); fireWeapon(); });
    }

    const collisionRaycaster = new THREE.Raycaster();
    function checkHorizontalCollision(pos, dir, distance, isPlayer = false) {
      collisionRaycaster.set(pos, dir);
      const intersects = collisionRaycaster.intersectObjects(terrainObjects, false);
      if (intersects.length > 0 && intersects[0].distance < distance) {
        if (!isPlayer && intersects[0].object.parent && intersects[0].object.parent.userData && intersects[0].object.parent.userData.text) return true;
        if (Math.abs(intersects[0].face.normal.y) < 0.5) return true; 
      }
      return false; 
    }

    // ==========================================
    // 6. 主渲染迴圈與物理更新 
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1); 
      prevTime = time;

      if (isGameStarted && !isGameOver && !isPaused && hp > 0) {
        
        // --- 輔助瞄準 (Auto-Aim) ---
        if (autoAimEnabled && !isTransitioning) {
          let closestAgent = null;
          let minDist = 0.25; // 磁吸範圍 (NDC 座標 -1~1，0.25代表中心圈)

          agents.forEach(agent => {
            if (agent.userData.dying) return;
            
            // 視線檢查 (是否有牆擋住)
            const dirToAgent = new THREE.Vector3().subVectors(agent.position, camera.position);
            const distToAgent = dirToAgent.length();
            dirToAgent.normalize();
            collisionRaycaster.set(camera.position, dirToAgent);
            const hits = collisionRaycaster.intersectObjects(terrainObjects, false);
            if (hits.length > 0 && hits[0].distance < distToAgent - 1.0) return; // 被牆擋住
            
            // 投影到螢幕座標
            const screenPos = agent.position.clone();
            screenPos.y += 1.5; // 瞄準胸部/頭部高度
            screenPos.project(camera);

            // 只鎖定在鏡頭前方的敵人
            if (screenPos.z < 1) {
              const distToCenter = Math.sqrt(screenPos.x * screenPos.x + screenPos.y * screenPos.y);
              if (distToCenter < minDist) {
                minDist = distToCenter;
                closestAgent = agent;
              }
            }
          });

          if (closestAgent) {
            // 平滑轉向敵人
            const targetPos = closestAgent.position.clone();
            targetPos.y += 1.5;
            const dummyCam = camera.clone();
            dummyCam.lookAt(targetPos);
            // Slerp 旋轉差值 (數值越大磁吸越強)
            camera.quaternion.slerp(dummyCam.quaternion, 6.0 * delta);
            // 更新 euler，避免滑鼠/觸控一動就彈回原處
            euler.setFromQuaternion(camera.quaternion);
            document.getElementById('crosshair').classList.add('locked');
          } else {
            document.getElementById('crosshair').classList.remove('locked');
          }
        } else {
          document.getElementById('crosshair').classList.remove('locked');
        }

        // --- 敵人動畫與移動 ---
        agents.forEach(agent => {
          if (agent.userData.dying) {
            agent.scale.multiplyScalar(0.9); 
            agent.rotation.x -= 5 * delta;
          } else {
            agent.lookAt(camera.position.x, agent.position.y, camera.position.z);
            
            const dist = agent.position.distanceTo(camera.position);
            let isMoving = false;
            
            if (enemyMoveSpeed > 0 && dist > 5) { 
              const dir = new THREE.Vector3();
              dir.subVectors(camera.position, agent.position);
              dir.y = 0; dir.normalize();
              
              const moveStepX = dir.x * enemyMoveSpeed * delta;
              const moveStepZ = dir.z * enemyMoveSpeed * delta;
              
              const enemyCheckOrigin = new THREE.Vector3(agent.position.x, agent.position.y + 0.5, agent.position.z);
              
              if (Math.abs(moveStepX) > 0 && !checkHorizontalCollision(enemyCheckOrigin, new THREE.Vector3(Math.sign(moveStepX), 0, 0), Math.abs(moveStepX) + 0.8, false)) {
                agent.position.x += moveStepX;
                isMoving = true;
              }
              if (Math.abs(moveStepZ) > 0 && !checkHorizontalCollision(enemyCheckOrigin, new THREE.Vector3(0, 0, Math.sign(moveStepZ)), Math.abs(moveStepZ) + 0.8, false)) {
                agent.position.z += moveStepZ;
                isMoving = true;
              }
            }

            const walkSpeed = 10;
            const walkTime = isMoving ? (time / 1000 * walkSpeed + agent.userData.walkOffset) : 0;
            
            agent.userData.leftLeg.rotation.x = Math.sin(walkTime) * 0.4;
            agent.userData.rightLeg.rotation.x = Math.sin(walkTime + Math.PI) * 0.4;
            
            agent.userData.yVelocity += gravity * delta;
            const agentFeetPos = agent.position.clone();
            agentFeetPos.y += 2.0; 
            collisionRaycaster.set(agentFeetPos, new THREE.Vector3(0, -1, 0));
            const groundHits = collisionRaycaster.intersectObjects(terrainObjects, false);
            
            if (groundHits.length > 0 && groundHits[0].distance < 2.5) {
               agent.userData.yVelocity = 0;
               agent.position.y = groundHits[0].point.y + (isMoving ? Math.abs(Math.sin(walkTime))*0.1 : 0);
            } else {
               agent.position.y += agent.userData.yVelocity * delta;
            }
            
            if (time > agent.userData.lastShootTime && !isTransitioning) {
              enemyShoot(agent);
              agent.userData.lastShootTime = time + enemyFireBase + Math.random() * enemyFireRand;
            }
          }
        });

        // --- 子彈物理 ---
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          const moveStep = p.userData.velocity.clone().multiplyScalar(delta);
          
          collisionRaycaster.set(p.position, p.userData.velocity.clone().normalize());
          const hitWall = collisionRaycaster.intersectObjects(terrainObjects, false);
          
          if (hitWall.length > 0 && hitWall[0].distance < moveStep.length()) {
            scene.remove(p);
            projectiles.splice(i, 1);
            continue;
          }

          p.position.add(moveStep);
          p.userData.aliveTimer -= delta;
          
          if (p.position.distanceTo(camera.position) < 1.2) { 
            takeDamage(10); 
            scene.remove(p);
            projectiles.splice(i, 1);
            continue;
          }
          if (p.userData.aliveTimer <= 0) {
            scene.remove(p);
            projectiles.splice(i, 1);
          }
        }

        // --- 玩家物理 ---
        let targetHeight = STAND_HEIGHT;
        let baseSpeed = 22.0;
        
        if (keys.crouch) {
          targetHeight = CROUCH_HEIGHT;
          baseSpeed = 10.0; 
          document.getElementById('stance-indicator').textContent = '[ CROUCHING ]';
        } else {
          document.getElementById('stance-indicator').textContent = '[ STANDING ]';
        }

        currentHeight += (targetHeight - currentHeight) * 15.0 * delta;

        yVelocity += gravity * delta;
        let nextY = playerBaseY + yVelocity * delta;

        const feetOrigin = new THREE.Vector3(camera.position.x, playerBaseY + 1.0, camera.position.z); 
        collisionRaycaster.set(feetOrigin, new THREE.Vector3(0, -1, 0));
        const groundHits = collisionRaycaster.intersectObjects(terrainObjects, false);
        
        if (groundHits.length > 0) {
          const groundY = groundHits[0].point.y;
          if (nextY <= groundY + 0.3) {
            if (yVelocity <= 0 || playerBaseY < groundY) {
              yVelocity = 0;
              nextY = groundY;
              if (keys.jump) yVelocity = jumpSpeed;
            }
          }
        }
        
        playerBaseY = nextY;
        camera.position.y = playerBaseY + currentHeight;

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        right.y = 0; right.normalize();

        const moveDirection = new THREE.Vector3();
        if (keys.w) moveDirection.add(forward);
        if (keys.s) moveDirection.sub(forward);
        if (keys.d) moveDirection.add(right);
        if (keys.a) moveDirection.sub(right);
        
        // 加上虛擬搖桿向量
        if (joystickVector.x !== 0 || joystickVector.y !== 0) {
          moveDirection.addScaledVector(forward, joystickVector.y); // NippleJS Y為正代表上方推
          moveDirection.addScaledVector(right, joystickVector.x);
        }

        if (moveDirection.lengthSq() > 0) moveDirection.normalize();

        const moveStep = moveDirection.clone().multiplyScalar(baseSpeed * delta);
        const checkOrigin = new THREE.Vector3(camera.position.x, playerBaseY + 0.4, camera.position.z);
        
        if (Math.abs(moveStep.x) > 0) {
          if (!checkHorizontalCollision(checkOrigin, new THREE.Vector3(Math.sign(moveStep.x), 0, 0), Math.abs(moveStep.x) + 0.5, true)) {
            camera.position.x += moveStep.x;
          }
        }
        if (Math.abs(moveStep.z) > 0) {
          if (!checkHorizontalCollision(checkOrigin, new THREE.Vector3(0, 0, Math.sign(moveStep.z)), Math.abs(moveStep.z) + 0.5, true)) {
            camera.position.z += moveStep.z;
          }
        }

        if (camera.position.y < -15) { takeDamage(100); }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouchDevice ? 1.5 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
