<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔鬼的計謀：正負數梭哈 - 線下裁判系統</title>
<style>
  :root {
    --bg-main: #0b132b;
    --card-bg: #1c2541;
    --card-inner: #111e38;
    --accent-gold: #f59e0b;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
  .wrapper { width: 100%; max-width: 760px; background: var(--card-bg); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #3a506b; }
  
  /* 頂部公牌展示 */
  .sym-section { text-align: center; margin-bottom: 16px; background: var(--card-inner); padding: 14px; border-radius: 12px; border: 1px solid #2e3e59; }
  .sym-container { display: flex; justify-content: center; gap: 14px; margin: 10px 0; }
  .sym-card { width: 62px; height: 84px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; font-size: 38px; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 10px; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4); }
  
  /* 分頁標籤 */
  .tab-group { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 10px; background: #243044; border: 1px solid #3b4b66; color: var(--text-muted); font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.15s; }
  .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* 卡片與按鈕排版 */
  .box { background: var(--card-inner); border: 1px solid #2e3e59; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { padding: 8px 14px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: #fff; transition: 0.15s; }
  button:hover { filter: brightness(1.15); }
  .btn-gold { background: var(--accent-gold); color: #000; }
  .btn-blue { background: var(--accent-blue); }
  .btn-green { background: var(--accent-green); }
  .btn-red { background: var(--accent-red); }

  /* 數字鍵盤 (-5 ~ +5) */
  .num-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0; }
  .num-btn { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px 0; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
  .num-btn.negative { color: #60a5fa; border-color: #2563eb; }
  .num-btn.zero { color: var(--accent-gold); }
  .num-btn.positive { color: #34d399; }
  .num-btn:hover { background: #334155; }

  /* 玩家手牌暫存區 */
  .hand-display { display: flex; gap: 8px; margin: 8px 0; min-height: 48px; align-items: center; }
  .hand-badge { background: #334155; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 16px; border: 1px solid #64748b; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
  th { background: #0f172a; color: var(--text-muted); }
  input[type="text"], input[type="number"] { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 13px; }

  /* 結果展示 */
  .result-banner { background: #064e3b; border: 1px solid var(--accent-green); border-radius: 8px; padding: 12px; margin-top: 10px; font-family: monospace; font-size: 14px; line-height: 1.6; }
  .result-banner strong { color: var(--accent-gold); font-size: 16px; }

  /* Toast 提示 */
  #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; }
  #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.3s 2.2s; }
  @keyframes fadein { from { bottom: 10px; opacity: 0; } to { bottom: 30px; opacity: 1; } }
  @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 10px; opacity: 0; } }
</style>
</head>
<body>

<div class="wrapper">
  <!-- 頂部：符號公牌生成區 -->
  <div class="sym-section">
    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">桌面四選三運算公牌</div>
    <div class="sym-container" id="sym-box">
      <div class="sym-card">+</div><div class="sym-card">-</div><div class="sym-card">×</div>
    </div>
    <div class="btn-row" style="justify-content: center;">
      <button class="btn-gold" onclick="rerollSymbols()">🎲 抽取新公牌 (保證相異)</button>
    </div>
  </div>

  <!-- 功能標籤列 -->
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('tab-solver')">🧠 手牌極限求解</button>
    <button class="tab-btn" onclick="switchTab('tab-judge')">🏆 牌桌全員裁判</button>
    <button class="tab-btn" onclick="switchTab('tab-validator')">🔍 算式逐步驗證</button>
  </div>

  <!-- 模組 1：單人極限求解器 -->
  <div id="tab-solver" class="panel active">
    <div class="box">
      <div style="font-size: 13px; color: var(--text-muted);">點擊輸入您的 4 張數字牌（範圍：-5 ～ +5）：</div>
      <div class="num-grid">
        <button class="num-btn negative" onclick="pushNum(-5)">-5</button>
        <button class="num-btn negative" onclick="pushNum(-4)">-4</button>
        <button class="num-btn negative" onclick="pushNum(-3)">-3</button>
        <button class="num-btn negative" onclick="pushNum(-2)">-2</button>
        <button class="num-btn negative" onclick="pushNum(-1)">-1</button>
        <button class="num-btn zero" onclick="pushNum(0)">0 (10)</button>
        <button class="num-btn positive" onclick="pushNum(1)">+1</button>
        <button class="num-btn positive" onclick="pushNum(2)">+2</button>
        <button class="num-btn positive" onclick="pushNum(3)">+3</button>
        <button class="num-btn positive" onclick="pushNum(4)">+4</button>
        <button class="num-btn positive" onclick="pushNum(5)">+5</button>
        <button class="num-btn" style="background:#ef4444; color:#fff;" onclick="clearNum()">清除</button>
      </div>

      <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">目前選擇手牌：</div>
      <div class="hand-display" id="hand-cards">
        <span style="color:#64748b;">尚未選滿 4 張牌</span>
      </div>

      <button class="btn-green" onclick="solveCurrentHand()" style="width: 100%; margin-top: 6px;">⚡ 窮舉 144 組排列尋找最優解</button>
    </div>

    <div id="solver-result"></div>
  </div>

  <!-- 模組 2：多人牌桌裁判比大小 -->
  <div id="tab-judge" class="panel">
    <div class="box">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <label>玩家人數: <input type="number" id="judge-player-cnt" value="3" min="2" max="8" style="width:55px;"></label>
        <button class="btn-blue" onclick="setupJudgeTable()">產生裁判名冊</button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">手牌輸入範例：<code>-3, 5, 0, -2</code> 或 <code>-5 4 1 -1</code></div>

      <table id="judge-table">
        <thead>
          <tr>
            <th style="width:25%;">玩家</th>
            <th style="width:75%;">實體 4 張手牌 (-5 ~ +5)</th>
          </tr>
        </thead>
        <tbody id="judge-tbody"></tbody>
      </table>

      <button class="btn-green" onclick="settleJudgeTable()" style="width:100%; margin-top:10px;">🏆 結算全桌最佳解並判定勝者</button>
    </div>

    <div id="judge-result"></div>
  </div>

  <!-- 模組 3：算式逐步驗證器 -->
  <div id="tab-validator" class="panel">
    <div class="box">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">輸入欲驗證的算式（支援負數括號，先乘除後加減）：</div>
      <input type="text" id="val-input" placeholder="例如: (-3) * 5 + 4 - (-2) 或 -5 + 3 * 2 - 0" style="width: 100%; margin-bottom: 8px;">
      <button class="btn-blue" onclick="validateCustomFormula()">驗證並逐步拆解計算</button>
    </div>

    <div id="validator-result"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SYMBOLS = ['+', '-', '×', '÷'];
let currentSymbols = ['+', '-', '×'];
let selectedCards = [];

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.backgroundColor = isErr ? '#ef4444' : '#10b981';
  t.className = "show";
  setTimeout(() => { t.className = t.className.replace("show", ""); }, 2500);
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function rerollSymbols() {
  currentSymbols = [...SYMBOLS].sort(() => 0.5 - Math.random()).slice(0, 3);
  document.getElementById('sym-box').innerHTML = 
    currentSymbols.map(s => `<div class="sym-card">${s}</div>`).join('');
  showToast("已成功抽取 3 張相異運算公牌！");
}

function pushNum(n) {
  if (selectedCards.length >= 4) {
    showToast("已滿 4 張牌！請先清除再選", true);
    return;
  }
  selectedCards.push(n);
  renderHandBadges();
}

function clearNum() {
  selectedCards = [];
  renderHandBadges();
  document.getElementById('solver-result').innerHTML = '';
}

function renderHandBadges() {
  const box = document.getElementById('hand-cards');
  if (selectedCards.length === 0) {
    box.innerHTML = `<span style="color:#64748b;">尚未選滿 4 張牌</span>`;
    return;
  }
  box.innerHTML = selectedCards.map(n => `<span class="hand-badge">${n > 0 ? '+' + n : n}</span>`).join('');
}

// 嚴格先乘除後加減核心演算
function evalTokens(nums, ops) {
  let curNums = [nums[0]];
  let curOps = [];

  // 第 1 步：優先處理乘除
  for (let i = 0; i < ops.length; i++) {
    let op = ops[i];
    let next = nums[i + 1];
    if (op === '×' || op === '÷') {
      let prev = curNums.pop();
      if (op === '÷') {
        if (next === 0) return null; // 除以 0 視為違規
        curNums.push(prev / next);
      } else {
        curNums.push(prev * next);
      }
    } else {
      curOps.push(op);
      curNums.push(next);
    }
  }

  // 第 2 步：依序計算加減
  let res = curNums[0];
  for (let i = 0; i < curOps.length; i++) {
    if (curOps[i] === '+') res += curNums[i + 1];
    else if (curOps[i] === '-') res -= curNums[i + 1];
  }
  return res;
}

function fmtNum(n) {
  return n < 0 ? `(${n})` : `${n}`;
}

function fmtFormula(nums, ops) {
  let str = fmtNum(nums[0]);
  for (let i = 0; i < ops.length; i++) {
    str += ` ${ops[i]} ${fmtNum(nums[i + 1])}`;
  }
  return str;
}

// 全排列求解最佳解 (4! * 3! = 144 組)
function solveAll(cards, symbols) {
  function perm(arr) {
    if (arr.length === 0) return [[]];
    let res = [];
    for (let i = 0; i < arr.length; i++) {
      let rest = perm(arr.slice(0, i).concat(arr.slice(i + 1)));
      for (let r of rest) res.push([arr[i], ...r]);
    }
    return res;
  }

  let cardPerms = perm(cards);
  let symPerms = perm(symbols);
  let allValid = [];

  for (let pNums of cardPerms) {
    for (let pOps of symPerms) {
      let val = evalTokens(pNums, pOps);
      if (val !== null && !isNaN(val)) {
        let rounded = Math.round(val * 100) / 100;
        let diff1 = Math.round(Math.abs(rounded - 1) * 100) / 100;
        let diff20 = Math.round(Math.abs(rounded - 20) * 100) / 100;
        let minDiff = Math.min(diff1, diff20);
        allValid.push({
          nums: pNums,
          ops: pOps,
          val: rounded,
          diff1,
          diff20,
          minDiff,
          target: (diff1 <= diff20) ? 1 : 20,
          formula: fmtFormula(pNums, pOps)
        });
      }
    }
  }

  // 排序找出總最優、最接近 1、最接近 20
  allValid.sort((a, b) => a.minDiff - b.minDiff);
  let bestOverall = allValid[0];

  let copy1 = [...allValid].sort((a, b) => a.diff1 - b.diff1);
  let bestTarget1 = copy1[0];

  let copy20 = [...allValid].sort((a, b) => a.diff20 - b.diff20);
  let bestTarget20 = copy20[0];

  return { bestOverall, bestTarget1, bestTarget20, all: allValid };
}

function solveCurrentHand() {
  if (selectedCards.length !== 4) {
    showToast("請先點擊選滿 4 張數字牌！", true);
    return;
  }
  let res = solveAll(selectedCards, currentSymbols);
  let div = document.getElementById('solver-result');

  div.innerHTML = `
    <div class="result-banner">
      <div>🏆 <strong>全場最佳算式</strong> (目標 ${res.bestOverall.target})：</div>
      <div style="font-size:18px; margin: 4px 0; color: #fff;">${res.bestOverall.formula} = <strong style="color:#34d399;">${res.bestOverall.val}</strong></div>
      <div style="color:var(--text-muted);">距目標絕對差距：<strong>${res.bestOverall.minDiff}</strong></div>
      <hr style="border-color:#1e3a5f; margin: 8px 0;">
      <div style="font-size:13px;">🎯 <strong>最接近 1：</strong> ${res.bestTarget1.formula} = ${res.bestTarget1.val} (差: ${res.bestTarget1.diff1})</div>
      <div style="font-size:13px; margin-top:2px;">🎯 <strong>最接近 20：</strong> ${res.bestTarget20.formula} = ${res.bestTarget20.val} (差: ${res.bestTarget20.diff20})</div>
    </div>
  `;
}

// 多人裁判表初始化
function setupJudgeTable() {
  let cnt = parseInt(document.getElementById('judge-player-cnt').value) || 3;
  let tbody = document.getElementById('judge-tbody');
  tbody.innerHTML = '';
  for (let i = 1; i <= cnt; i++) {
    tbody.innerHTML += `
      <tr>
        <td><strong>玩家 ${i}</strong></td>
        <td><input type="text" id="judge-p-${i}" placeholder="如: -5, 3, -1, 4" style="width: 100%;"></td>
      </tr>
    `;
  }
}

function settleJudgeTable() {
  let cnt = parseInt(document.getElementById('judge-player-cnt').value) || 3;
  let results = [];

  for (let i = 1; i <= cnt; i++) {
    let raw = document.getElementById(`judge-p-${i}`).value;
    let nums = raw.match(/-?\d+/g);
    if (!nums || nums.length !== 4) {
      showToast(`玩家 ${i} 手牌未完整填入 4 個數字！`, true);
      return;
    }
    nums = nums.map(x => parseInt(x));
    for (let n of nums) {
      if (n < -5 || n > 5) {
        showToast(`玩家 ${i} 的數字 ${n} 超出 -5 ～ +5 範圍！`, true);
        return;
      }
    }
    let res = solveAll(nums, currentSymbols);
    results.push({ id: i, name: `玩家 ${i}`, best: res.bestOverall });
  }

  results.sort((a, b) => a.best.minDiff - b.best.minDiff);
  let minDiff = results[0].best.minDiff;
  let winners = results.filter(r => r.best.minDiff === minDiff);

  let div = document.getElementById('judge-result');
  div.innerHTML = `
    <div class="result-banner">
      <div style="font-size:15px; margin-bottom:6px;"><strong>════ 裁判終局裁決 ════</strong></div>
      ${results.map(r => `
        <div style="margin-bottom: 4px;">
          ${r.name}：[ ${r.best.formula} ] = <strong>${r.best.val}</strong> (距 ${r.best.target} 差: ${r.best.minDiff})
        </div>
      `).join('')}
      <hr style="border-color:#1e3a5f; margin: 8px 0;">
      <div style="font-size:16px; color:#34d399;">
        🎉 <strong>獲勝玩家：${winners.map(w => w.name).join('、')}</strong> (以最小差距 ${minDiff} 奪得底池！)
      </div>
    </div>
  `;
}

// 算式逐步拆解驗算
function validateCustomFormula() {
  let raw = document.getElementById('val-input').value.trim();
  if (!raw) return;

  let norm = raw.replace(/\*/g, '×').replace(/\//g, '÷');
  // 提取包含負號的數與運算子
  let regex = /(-?\d+)|([+\-×÷])/g;
  let tokens = [];
  let m;
  
  // 簡易解析連續運算
  norm = norm.replace(/\s+/g, '');
  // 將 (-n) 轉為 -n 供解析
  norm = norm.replace(/\((-?\d+)\)/g, '$1');

  let curNumStr = '';
  let ops = [];
  let nums = [];

  // 手動安全切分
  for (let i = 0; i < norm.length; i++) {
    let ch = norm[i];
    if (ch === '+' || ch === '×' || ch === '÷') {
      if (curNumStr) nums.push(parseInt(curNumStr));
      curNumStr = '';
      ops.push(ch);
    } else if (ch === '-') {
      // 判斷是減號還是負號：如果前一個字元是運算子或在開頭，則是負號
      if (i === 0 || ['+', '-', '×', '÷'].includes(norm[i - 1])) {
        curNumStr += ch;
      } else {
        if (curNumStr) nums.push(parseInt(curNumStr));
        curNumStr = '';
        ops.push('-');
      }
    } else if (!isNaN(parseInt(ch))) {
      curNumStr += ch;
    }
  }
  if (curNumStr) nums.push(parseInt(curNumStr));

  if (nums.length !== 4 || ops.length !== 3) {
    showToast("算式格式錯誤！必須由 4 個數字與 3 個運算符組成", true);
    return;
  }

  let val = evalTokens(nums, ops);
  let div = document.getElementById('validator-result');

  if (val === null) {
    div.innerHTML = `<div class="result-banner" style="background:#7f1d1d; border-color:#ef4444;">❌ 算式中除以 0，無效且違規出局！</div>`;
    return;
  }

  let rounded = Math.round(val * 100) / 100;
  let diff1 = Math.round(Math.abs(rounded - 1) * 100) / 100;
  let diff20 = Math.round(Math.abs(rounded - 20) * 100) / 100;

  div.innerHTML = `
    <div class="result-banner">
      <div><strong>✅ 算式合法性通過</strong></div>
      <div style="font-size:16px; margin: 4px 0;">解析算式：${fmtFormula(nums, ops)} = <strong>${rounded}</strong></div>
      <div style="color:var(--text-muted); font-size:12px;">（已嚴格執行負數符號與先乘除後加減）</div>
      <div style="margin-top:4px;">距 1 差距：${diff1} ｜ 距 20 差距：${diff20} ｜ <strong>最優距離：${Math.min(diff1, diff20)}</strong></div>
    </div>
  `;
}

// 預設產生名冊
setupJudgeTable();
</script>
</body>
</html>
