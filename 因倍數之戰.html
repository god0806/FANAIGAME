.room-qr { margin-top: .5rem; }
.room-qr summary { cursor: pointer; font-size: .875rem; font-weight: 700; }
.room-qr svg { display: block; margin: .75rem auto .35rem; max-width: 100%; height: auto; background: white; }
.room-qr p { max-width: 192px; margin: .35rem auto 0; font-size: .8rem; }

.computer-entry{margin-top:22px;padding:16px;border:1px solid #cbd7b6;border-radius:12px;background:#edf2e1}.computer-entry p{font-size:12px;margin:8px 0 0}

.hint-control{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:12px 14px;background:#f0f2e8;border-radius:9px;cursor:pointer}
.hint-control input{width:20px;height:20px;margin:0;flex:0 0 20px;accent-color:var(--green)}
.hint-control small{display:block;font-size:11px;font-weight:400;color:var(--muted)}

.winner-dialog{padding:0;border:1px solid #ced8b8;border-radius:24px;background:#fbfcf0;color:var(--ink);width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 26px 90px #142e3566;overflow:auto}
.winner-dialog::backdrop{background:#132d25b8;backdrop-filter:blur(5px)}
.winner-content{position:relative;text-align:center;padding:32px 28px}
.winner-trophy{display:block;font-size:72px;line-height:1.2;animation:winner-pop .65s ease-out both}
.winner-kicker{font-size:13px;font-weight:700;color:#637633;letter-spacing:2px;margin:20px 0 8px}
.winner-content h2{font-size:clamp(24px,5vw,36px);line-height:1.4;margin:0;overflow-wrap:anywhere}
.winner-result{font-weight:700;background:#e7efce;border-radius:10px;padding:10px}
.winner-cheer{font-size:17px;line-height:1.9;margin:22px 0 14px}
.winner-thanks{font-size:13px;color:#627266}
.winner-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.winner-confetti{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none}
.winner-confetti i{position:absolute;top:-16px;width:8px;height:14px;animation:winner-fall 2.3s ease-out both}
@keyframes winner-fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(600px) rotate(650deg);opacity:0}}
@keyframes winner-pop{0%{transform:scale(.5) rotate(-12deg)}65%{transform:scale(1.15) rotate(7deg)}100%{transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.winner-trophy,.winner-confetti i{animation:none}.winner-confetti{display:none}}

.remove-player{margin-left:auto;padding:5px 9px;flex-shrink:0;border:1px solid #d3aaa4;border-radius:7px;background:#fff5ef;color:#8a423c;font-size:12px}
.player{flex-wrap:wrap}
